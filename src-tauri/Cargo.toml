[package]
name = "quickwheel"
version = "1.0.0"
description = "Ultra-lightweight radial application launcher"
authors = ["QuickWheel"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "quickwheel_lib"
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["system-tray", "shell-execute", "shell-open", "window-center", "window-close", "window-hide", "window-set-focus", "window-show", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
tokio = { version = "1.35", features = ["rt", "sync"] }
anyhow = "1.0"
directories = "5.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
auto-launch = "0.5.0"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
